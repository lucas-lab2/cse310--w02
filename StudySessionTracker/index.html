<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Session Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Study Session Tracker</h1>

    <form id="session-form">
      <input id="subject" type="text" placeholder="Subject (e.g. JavaScript)">
      <input id="minutes" type="number" min="1" placeholder="Minutes">
      <input id="date" type="date">
      <button type="submit">Add session</button>
    </form>
    <p id="error" class="error"></p>

    <h2>Total time: <span id="total">0h 0min</span></h2>

    <h2>By subject</h2>
    <ul id="subjects"></ul>

    <h2>Sessions</h2>
    <ul id="session-list"></ul>
  </main>

  <!-- tracker.js must load first because app.js uses its functions -->
  <script src="tracker.js"></script>
  <script src="app.js"></script>
</body>
</html>
